name: Build 톡todo test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test parser and build temporary debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/tok-todo.apk

      - name: Upload mobile test APK
        uses: actions/upload-artifact@v4
        with:
          name: tok-todo-apk
          path: dist/tok-todo.apk
          retention-days: 30
